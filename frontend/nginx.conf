server {
  listen 80;
  client_max_body_size 30m;
  root /usr/share/nginx/html;

  location /api/ { proxy_pass http://backend:8000; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme; }
  location /admin/ { proxy_pass http://backend:8000; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; }
  location /static/ { proxy_pass http://backend:8000; }
  location / { try_files $uri /index.html; }
}
